<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="assets/logo_favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Best Practices -->
    <title>BRICKED-UP — LEGO Parts Scanner &amp; Bin Manager (Vanilla)</title>
    <meta name="description" content="Identify your LEGO bricks from photos using AI, catalogue them in your inventory bin, and check which build sets you can create right now." />
    <meta name="author" content="BRICKED-UP Team" />

    <!-- Style Modules -->
    <link rel="stylesheet" href="css/tokens.css?v=24516a4a93" />
    <link rel="stylesheet" href="css/global.css?v=b6fd5237f8" />
    <link rel="stylesheet" href="css/workspace.css?v=9a18d31375" />
    <link rel="stylesheet" href="css/panel.css?v=89cef19fad" />
    <link rel="stylesheet" href="css/actionbar.css?v=74edbdff35" />
    <link rel="stylesheet" href="css/auth.css?v=87a3f4c16b" />
    <link rel="stylesheet" href="css/components.css?v=4a3b059223" />
  </head>
  <body>
    <!-- Main Application Wrapper -->
    <div id="app">
      <!-- Loaded dynamically via js/app.js -->
      <div id="app-loading" style="display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; background-color: var(--cream-100);">
        <div class="brick-spinner-container">
          <div class="brick-stud-spinner large">
            <div class="stud-spinner-top"></div>
            <div class="stud-spinner-body"></div>
          </div>
          <p class="brick-spinner-message font-display">Initializing BRICKED-UP Vanilla...</p>
        </div>
      </div>
    </div>

    <!--
      Attribution for the part catalogue data and artwork. Sits outside #app so
      it survives the app's re-renders.

      Updated when part resolution moved to Rebrickable's elements table: the
      photos are now served from Rebrickable's CDN, keyed by element id, so
      crediting BrickLink for them was simply wrong. BrickLink is still named
      because that is where the "Buy this part" links in the missing-parts
      email point.
    -->
    <div class="corner-overlay">
      <!--
        Styled after the pill on the back of a LEGO Classic box, where an
        arrow-in-circle glyph sits next to a URL. Same idea here: a small,
        quiet mark that points somewhere official.
      -->
      <a class="brickyield-pill" href="https://brickyield.streamlit.app/"
         target="_blank" rel="noopener noreferrer"
         title="Brickyield - what your bricks are worth">
        <span class="brickyield-glyph" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="9 7 17 7 17 15"></polyline>
          </svg>
        </span>
        <span class="brickyield-text">Bricks counted. Now see what they yield.</span>
      </a>
      <div class="attribution-credit">
        Part, colour and element data &amp; images from
        <a href="https://rebrickable.com/" target="_blank" rel="noopener noreferrer">Rebrickable</a>
        &middot; purchase links to
        <a href="https://www.bricklink.com/" target="_blank" rel="noopener noreferrer">BrickLink</a>
      </div>
    </div>

    <!-- Application Entry Point -->
    <script src="js/app.js?v=5c43969708"></script>
  </body>
</html>
